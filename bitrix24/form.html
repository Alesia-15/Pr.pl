	<title>Bitrix форма</title>

<body>
	<div class="container">
		<h1>Битрикс24 Форма для сайта privoz.pl</h1>
		<form action="https://privoz.pl/bitrix24/bitrix24_privoz.php" method="get">
			<div class="form-group">
				<label for="name">Имя *</label>
				<input type="text" class="form-control" id="name" name="name" placeholder="Ваше имя">
			</div>
			<div class="form-group">
				<label for="phone">Номер телефона *</label>
				<input type="text" class="form-control" id="phone" name="phone" placeholder="Ваш номер телефона">
			</div>
			<div class="form-group">
				<label for="email">Электронная почта</label>
				<input type="text" class="form-control" id="email" name="email" placeholder="Почта">
			</div>
			<div class="form-group">
				<label for="comment">Комментарий</label>
				<input type="text" class="form-control" id="comment" name="comment" placeholder="Описание лида">
			</div>
			
			<div class="form-group">
				<label for="utm_source">utm_source</label>
				<input type="text" class="form-control" id="utm_source" name="utm_source" placeholder="utm_source">
			</div>
			<div class="form-group">
				<label for="utm_medium">utm_medium</label>
				<input type="text" class="form-control" id="utm_medium" name="utm_medium" placeholder="utm_medium">
			</div>
			<div class="form-group">
				<label for="utm_term">utm_term</label>
				<input type="text" class="form-control" id="utm_term" name="utm_term" placeholder="utm_term">
			</div>
			<div class="form-group">
				<label for="utm_content">utm_content</label>
				<input type="text" class="form-control" id="utm_content" name="utm_content" placeholder="utm_content">
			</div>
			<div class="form-group">
				<label for="utm_campaign">utm_campaign</label>
				<input type="text" class="form-control" id="utm_campaign" name="utm_campaign" placeholder="utm_campaign">
			</div>
			<button type="submit" class="btn btn-default">Отправить</button>
		</form>
	</div>
